<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#000;color:#fff;font-family:"Open Sans",system-ui,sans-serif}
.status{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13px;color:#aaa}
h1{font-weight:300;font-size:72px;letter-spacing:-.03em;line-height:1;white-space:nowrap;margin:14px 0 0 12px}
.src{display:flex;gap:10px;align-items:baseline;padding:8px 16px 16px;font-size:15px;color:#bbb}
.src b{color:#fff;font-weight:600}.src i{font-style:normal;color:#1BA1E2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.t{height:171px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.t .n{font-size:17px;font-weight:600}
.t .c{position:absolute;top:10px;left:10px;font-size:13px;opacity:.85}
.t.wide{grid-column:span 2;height:120px}
.t .msg{position:absolute;top:30px;left:10px;right:10px;font-size:15px;line-height:1.3;font-weight:400}
.t .cnt{position:absolute;top:6px;right:10px;font-size:40px;font-weight:300}
.small{height:82px}
nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#1F1F1F;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:12px}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#999}
nav a.on{color:#1BA1E2}
</style></head><body>
<div class="status"><span>9:41</span><span>82%</span></div>
<h1>third ear</h1>
<div class="src"><b>hearing aids</b><span>LE Audio</span><i>● ready</i></div>
<div class="grid">
<div class="t wide" style="background:#D80073"><span class="c">ask hermes · HRM</span><span class="cnt">1</span><span class="msg">“Your train is at 18:12 from platform 3, I added it to the calendar.”</span><span class="n">ask hermes</span></div>
<div class="t" style="background:#8CBF26"><span class="c">FAM</span><span class="n">family</span></div>
<div class="t" style="background:#1BA1E2"><span class="c">CLP</span><span class="n">transcript to clipboard</span></div>
<div class="t small" style="background:#F09609"><span class="c">MTG</span><span class="n">meeting notes</span></div>
<div class="t small" style="background:#333"><span class="c">SAV</span><span class="n">save</span></div>
</div>
<nav><a class="on">▦<span>board</span></a><a>≣<span>log</span></a><a>⇄<span>groups</span></a><a>⚙<span>setup</span></a></nav>
</body></html>
