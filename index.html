<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Third Ear has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://cypherpunk.today/third-ear/">
<meta http-equiv="refresh" content="3; url=https://cypherpunk.today/third-ear/">
<style>
  html { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font: 1.0625rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f5f2; color: #1d1d1b; }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 .75rem; }
  a { color: #0b5cad; word-break: break-all; }
  @media (prefers-color-scheme: dark) { body { background: #17181a; color: #ecebe8; } a { color: #8ab8f0; } }
</style>
<script>
  // Keep language folder, deep path, query and hash.
  (function () {
    var rest = location.pathname.replace(/^\/third-ear(\/|$)/, "");
    location.replace("https://cypherpunk.today/third-ear/" + rest + location.search + location.hash);
  })();
</script>
</head>
<body>
<main>
  <h1>Third Ear has moved</h1>
  <p>The website now lives at <a href="https://cypherpunk.today/third-ear/">cypherpunk.today/third-ear</a>. You are being redirected.</p>
  <p>If nothing happens, follow the link.</p>
</main>
</body>
</html>
