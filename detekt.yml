build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 2
    style: 1

processors:
  active: true
  exclude:
    - "FunctionCountProcessor"
    - "PropertyCountProcessor"

config:
  validation: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - "Composable"
      - "Preview"

style:
  MagicNumber:
    active: true
    ignoreAnnotated: ["Composable"]
    ignoreEnums: true
    # a named value already says what the number is
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNumbers: ["-1", "0", "1", "2", "42", "1000"]
    # the palette is a table of colours
    excludes: ["**/test/**", "**/androidTest/**", "**/ui/Theme.kt"]
  MaxLineLength:
    active: true
    # Third Ear's Kotlin is written wide (Compose modifier chains, one-line guards)
    maxLineLength: 160
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes: ["**/test/**", "**/androidTest/**"]

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ["Composable", "Preview"]
    functionPattern: "[a-z][A-Za-z0-9]*"

Compose: # io.nlopez.compose.rules
  ComposableParametersOrdering:
    active: true
  ModifierDefaultValue:
    active: true
  MissingModifierDefaultValue:
    active: true
  PublicComposablePreview:
    active: true
