[versions]
#jetbrains
kotlin = "2.3.10"
#KSP
ksp = "2.3.12"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#AndroidX
androidx-constraintlayout = "2.2.2"
androidx-documentfile = "1.1.0"
androidx-swiperefreshlayout = "1.2.0"
#Eventbus
eventbus = "3.3.1"
#Fossify
#noinspection GradleDependency
commons = "7.1.3"
#AudioRecordView
audiorecordview = "1.0.5"
#TAndroidLame
tandroidlame = "de282c8f68"
#AutofitTextView
autofittextview = "0.2.1"
#Gradle
gradlePlugins-agp = "9.4.1"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "31"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
#AndroidX
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
#Compose
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
compose-ui = { module = "androidx.compose.ui:ui", version = "1.9.2" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.6" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.4" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.10.0" }
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Fossify
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
#EventBus
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
#AudioRecordView
audiorecordview = { module = "com.github.Armen101:AudioRecordView", version.ref = "audiorecordview" }
#TAndroidLame
tandroidlame = { module = "com.github.naveensingh:TAndroidLame", version.ref = "tandroidlame" }
#AutofitTextView
autofittextview = { module = "me.grantland:autofittextview", version.ref = "autofittextview" }
[plugins]
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
